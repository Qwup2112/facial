_base_: ../resnet18.yaml
runs_dir: runs/ckplus             # transfer checkpoints; src.ckplus_cv writes to ckplus.cv_runs_dir
data:
  splits_dir: data/ckplus/splits/transfer   # src.ckplus_cv swaps in splits/fold{k}
  num_classes: 6                  # CK+ has no neutral; contempt is dropped
train:
  class_weight_ratio: 2.0         # CK+ is imbalanced (fear 75 vs surprise 249 images): weights on in every fold
  stages:
    - name: head
      epochs: 5
      trainable: [fc]
      lr: {fc: 1.0e-3}
    - name: finetune
      epochs: 40                  # ~24 steps per epoch on CK+
      trainable: [all]
      lr: {layer4: 1.0e-4, layer3: 5.0e-5, layer2: 3.0e-5, fc: 5.0e-4, all: 2.0e-5}   # first matching prefix wins
